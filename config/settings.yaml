bot:
  name: VN Edge
  version: 2.0.0
  mode: paper
  operating_mode: paper_enforced
  strict_mode: true
symbols:
- BTC/USDT
- ETH/USDT
- SOL/USDT
- XRP/USDT
- LTC/USDT
- ADA/USDT
- DOT/USDT
- TAO/USDT
- DOGE/USDT
- LINK/USDT
- AVAX/USDT
# Meme / high-beta alts.
# ccxt_client now handles 1000x name mapping (PEPE->1000PEPE etc.) natively.
# Depth snapshot 2026-04-16 (top-5 USD) informs keep/drop:
#   TRUMP ~$400K, WIF ~$82K, POPCAT ~$73K → real liquidity
#   SUI/NEAR — tradeable via ccxt path, regime gate manages thin windows
#   PEPE/SHIB/BONK ~$12-$29 top-5 depth → low_liquidity regime will veto
#   them automatically; kept in list for ML observation
- PEPE/USDT
- SHIB/USDT
- WIF/USDT
- SUI/USDT
- NEAR/USDT
- BONK/USDT
- TRUMP/USDT
- POPCAT/USDT
- MEME/USDT
exchange:
  name: delta
  region: india
  market_type: futures
  testnet: false
  rate_limit: true
  websocket: true
  rest_fallback: true
  reconnect_attempts: 10
  reconnect_delay: 5
execution:
  order_type: auto
  retry_taker_on_reject: true
  max_entry_slip_bps: 30
  min_trail_hold_sec: 15
# real_trading: section REMOVED (2026-04-20 Option-A consolidation).
# The legacy shared-account RealManager is retired. Per-user trading is
# driven by users.bot_mode (PostgreSQL) + user_api_keys, routed through
# UserRealRegistry. Risk caps (max_leverage, max_daily_loss_pct, etc.)
# are now per-user in the users table, not global here. See
# dashboard/user_trading_routes.py:handle_user_real_toggle.
real_trading_deprecated:
  # Kept as empty placeholder so any stray getattr(config, "real_trading", {}).get(...)
  # returns None without crashing. Remove after one clean release cycle.
  enabled: false
  dry_run: true
ml:
  shadow_mode: true
  veto_skip: true
  pair_thresholds:
    BTC/USDT: 0.4
    ETH/USDT: 0.4
    SOL/USDT: 0.42
    AVAX/USDT: 0.45
    LINK/USDT: 0.45
    DOGE/USDT: 0.48
  default_threshold: 0.42
timeframes:
  primary: 5m
  higher: 15m
  trigger: 1m
  macro: 1h
  session: 4h
strategy:
  active: multi_strategy
  indicators:
    ema:
      fast: 9
      medium: 21
      slow: 50
      trend: 200
    rsi:
      period: 14
      overbought: 70
      oversold: 30
    macd:
      fast: 12
      slow: 26
      signal: 9
    atr:
      period: 14
      multiplier: 1.5
    supertrend:
      period: 10
      multiplier: 3.0
    bollinger:
      period: 20
      std_dev: 2.0
    vwap:
      enabled: true
    mfi:
      period: 14
      overbought: 80
      oversold: 20
    volume:
      spike_multiplier: 2.0
      lookback: 20
  filters:
    min_confidence: 70
    min_grade: B
    chop_filter: false
    spread_max_pct: 0.15
    cooldown_seconds: 180
    duplicate_prevention: true
    max_signals_per_hour: 12
risk:
  risk_per_trade_pct: 1.0
  max_position_size_usd: 100
  max_daily_loss_pct: 3.0
  max_open_positions: 3
  max_exposure_per_symbol_pct: 50.0
  max_correlated_exposure_pct: 100.0
  default_leverage: 5
  max_leverage: 75
  stop_loss:
    type: atr
    fixed_pct: 1.5
    atr_multiplier: 1.8
  take_profit:
    tp1_rr: 1.5
    tp2_rr: 2.5
    tp3_rr: 4.0
    tp1_close_pct: 60
    tp2_close_pct: 25
    tp3_close_pct: 15
  trailing:
    enabled: true
    activation_rr: 0.8
    trail_pct: 0.4
    break_even_after_tp1: true
  safety:
    circuit_breaker_losses: 3
    circuit_breaker_cooldown: 3600
    volatility_kill_switch: true
    volatility_kill_atr_multiplier: 3.0
    max_api_failures: 5
    api_failure_cooldown: 300
    cooloff_after_sl: 180
paper_trading:
  initial_balance: 1000
  maker_fee_rate: 0.0002
  taker_fee_rate: 0.0005
  fee_rate: 0.0005
  settlement_fee_rate: 0.0006
  slippage_pct: 0.05
orderbook:
  enabled: true  # RE-ENABLED: fixed API response unwrapping ("result" key)
  poll_interval: 10    # seconds between L2 REST polls per symbol
  depth: 20            # levels per side
  stale_threshold: 30  # seconds before snapshot considered stale
grid:
  enabled: true
  grid_pct: 0.003
  num_levels: 15
  position_usd: 50
  fee_rt: 0.0008
  max_positions: 30
  stale_pct: 0.025
  sma_period: 100
  leverage: 10
  smart_buys: true
backtest:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  fee_rate: 0.00055
  slippage_pct: 0.05
  initial_balance: 10000
alerts:
  telegram:
    enabled: true
    include_chart: false
    alert_on_pre_signal: true
    alert_on_confirmed: true
    alert_on_tp_hit: true
    alert_on_sl_hit: true
    alert_on_exit: true
    alert_on_system: true
  console:
    enabled: true
    colored: true
logging:
  level: INFO
  file_enabled: false
  console_enabled: false
  max_file_size_mb: 50
  backup_count: 10
  log_indicator_values: false
  log_rejected_signals: true
journal:
  enabled: true
  export_csv: true
  export_json: true
dashboard:
  enabled: true
  refresh_interval: 5
  max_alerts_display: 50
indian_market:
  enabled: true
  fno_expiry_day: thursday
  fno_expiry_boost: 5
  holiday_file: ''
  ranging_limited_scanners:
  - liquidity_sweep
  - vwap_mean_revert
  - structure_bounce
  - rsi_divergence
  windows:
  - name: nse_open_auction
    start_hour: 9.0
    end_hour: 9.5
    confidence_adj: 0
    block: true
    regime_override: ''
  - name: nse_open_settle
    start_hour: 9.5
    end_hour: 9.75
    confidence_adj: -10
    block: false
    regime_override: ''
  - name: nse_post_open
    start_hour: 9.75
    end_hour: 11.0
    confidence_adj: 12
    block: false
    regime_override: ranging_limited
  - name: nse_midday
    start_hour: 11.0
    end_hour: 14.5
    confidence_adj: 0
    block: false
    regime_override: ''
  - name: nse_pre_close
    start_hour: 14.5
    end_hour: 15.0
    confidence_adj: 5
    block: false
    regime_override: ''
  - name: nse_close_rebalance
    start_hour: 15.0
    end_hour: 16.0
    confidence_adj: 15
    block: false
    regime_override: ranging_limited
  sessions:
  - name: asia_late
    start_hour: 2.5
    end_hour: 9.0
    confidence_adj: -15
    min_confidence: 65
  - name: india_morning
    start_hour: 9.0
    end_hour: 11.0
    confidence_adj: -5
    min_confidence: 65
  - name: india_midday
    start_hour: 11.0
    end_hour: 13.5
    confidence_adj: 0
    min_confidence: 60
  - name: europe
    start_hour: 13.5
    end_hour: 20.5
    confidence_adj: 5
    min_confidence: 65
  - name: us
    start_hour: 20.5
    end_hour: 2.5
    confidence_adj: 0
    min_confidence: 65
